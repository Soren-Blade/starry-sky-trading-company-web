<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="星辰商行 —— 精选商品与共享账号资源。">
    <title>星辰商行</title>

    <!--
      明暗主题的首屏兜底。
      必须在任何样式表之前同步执行：主题属性晚一步写入，用户就会先看到浅色、
      再闪一下切深色（FOUC）。这段脚本与 `stores/theme.js` 的 apply() 完全等价，
      区别只是它跑在 JS 包下载完成之前。存储键与 EC 设计系统一致（ec-theme）。
    -->
    <script>
      (function () {
        var mode = 'light'
        try {
          var saved = localStorage.getItem('ec-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved
        } catch (e) {
          /* 隐私模式下 localStorage 不可读：按浅色渲染，与 store 的兜底一致 */
        }
        var dark =
          mode === 'dark' ||
          (mode === 'auto' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
        root.setAttribute('data-theme-mode', mode)
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>

    <!--
      等宽字体走系统栈（JetBrains Mono 若本机已安装则优先，否则退回
      SF Mono / Cascadia Code / Consolas / monospace）。不再请求 Google Fonts：
      国内网络不可达，且同步样式会阻塞首屏。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
